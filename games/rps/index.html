
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/normalize.css" />
  <title>cc | 石头剪刀布</title>
  <link rel="icon" href="https://nmww.github.io/moyu-games-cn/" sizes="192x192" />
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/svg+xml" href="../../libs/brand-favicon.svg">
<link rel="stylesheet" href="../../libs/mobile.css">
<script src="../../libs/touch.js"></script>
</head>

<body>
  <div id="container">
    <h2>石头剪刀布</h2>
    <div id="game-container">
      <div id="points">
        <label for="playerPoints">玩家分数：</label>
        <span class="playerPoints"></span>
        <label for="computerPoints">电脑分数：</label>
        <span class="computerPoints"></span>
      </div>
      <div id="choice">
        <div id="playerChoice">
          <img src="" alt="" id="playerChoiceImg">
          <h3 id="playerChoiceTxt"></h3>
        </div>
        <div id="computerChoice">
          <img src="" alt="" id="computerChoiceImg">
          <h3 id="computerChoiceTxt"></h3>
        </div>
      </div>
      <div id="buttons">
        <button class="btn">石头</button>
        <button class="btn">布</button>
        <button class="btn">剪刀</button>
      </div>
    </div>
  </div>
  <footer class="page-footer">
    <span>made by </span>
    <a href="https://nmww.github.io/moyu-games-cn/" target="_blank">
      <img class="touxiang"  src="https://nmww.github.io/moyu-games-cn/" alt="cc logo">
    </a>
  </footer>
  <script src="js/script.js"></script>
</body>

</html>
